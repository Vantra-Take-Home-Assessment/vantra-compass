# Gateway: keeps the public API identical to the monolith's (same host,
# same paths) while routing to the split services. Clients don't change.
events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;   # docker DNS; re-resolve so scaled replicas are picked up

  server {
    listen 80;
    client_max_body_size 1m;

    # Service-to-service only. Never reachable from outside.
    location /internal/ { return 404; }

    # Swagger: each service serves /docs/<service> (+ /docs/<service>-json).
    # /docs/fleet-api falls through to the catch-all below.
    location /docs/ingestion { set $u http://ingestion:3000; proxy_pass $u; }
    location /docs/alerting  { set $u http://alerting:3000;  proxy_pass $u; }

    location /ingestion/ { set $u http://ingestion:3000; proxy_pass $u; }
    location /alerts     { set $u http://alerting:3000;  proxy_pass $u; }
    location /admin/     { set $u http://alerting:3000;  proxy_pass $u; }
    location /           { set $u http://fleet-api:3000; proxy_pass $u; }
  }
}
